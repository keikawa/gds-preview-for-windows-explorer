name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Zig
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.15.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'zig-0.15.2'
          Invoke-WebRequest `
            -Uri 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' `
            -OutFile $archive
          $expected = '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Zig archive checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'zig-x86_64-windows-0.15.2') >> $env:GITHUB_PATH

      - name: Build and test
        shell: powershell
        run: .\scripts\build.ps1

      - name: Determine package version
        id: version
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            '0.1.0-beta.1-ci'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: powershell
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged build
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "GDS Preview for Windows Explorer $env:GITHUB_REF_NAME" `
            --generate-notes `
            --prerelease
